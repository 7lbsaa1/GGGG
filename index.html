<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sky7 — تسجيل الدخول</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/128/7978/7978734.png">
<link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
<main class="auth-shell">
  <section class="auth-card glass">
    <img class="brand-logo" src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" alt="sky7">
    <h1>sky7</h1><p class="muted">صور السماء والطقس والطبيعة والتصوير</p>
    <form id="loginForm">
      <label>البريد الإلكتروني<input id="email" type="email" required autocomplete="email"></label>
      <label>كلمة المرور<div class="password-box"><input id="password" type="password" required autocomplete="current-password"><button type="button" id="togglePassword">إظهار</button></div></label>
      <button class="primary-btn" id="loginBtn">تسجيل الدخول</button>
    </form>
    <p class="auth-link">ليس لديك حساب؟ <a href="registration.html">إنشاء حساب</a></p>
    <div id="toast"></div>
  </section>
</main>
<script type="module" src="js/auth.js"></script>
</body></html>
