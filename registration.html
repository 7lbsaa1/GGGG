<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب | sky7</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <!-- الشعار -->
            <div class="auth-logo">
                <img
                    src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png"
                    alt="sky7"
                >
            </div>

            <div class="auth-header">
                <h1>إنشاء حساب</h1>
                <p>انضم إلى مجتمع sky7 وشارك صورك المميزة</p>
            </div>

            <!-- رسالة الخطأ / النجاح -->
            <div id="authMessage" class="auth-message" hidden></div>

            <form id="registrationForm">

                <!-- الاسم الكامل -->
                <div class="input-group">
                    <label for="fullName">الاسم الكامل</label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="اكتب اسمك الكامل"
                        autocomplete="name"
                        required
                    >
                </div>

                <!-- اسم المستخدم -->
                <div class="input-group">
                    <label for="username">اسم المستخدم</label>

                    <div class="username-input">
                        <span>@</span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="اسم المستخدم"
                            autocomplete="username"
                            minlength="3"
                            maxlength="30"
                            required
                        >
                    </div>

                    <small>
                        استخدم حروفًا وأرقامًا وشرطة سفلية فقط.
                    </small>
                </div>

                <!-- البريد -->
                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- كلمة المرور -->
                <div class="input-group">
                    <label for="password">كلمة المرور</label>

                    <div class="password-input">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="إظهار كلمة المرور"
                        >
                            👁
                        </button>

                    </div>

                    <div class="password-strength">
                        <div id="passwordStrengthBar"></div>
                    </div>

                    <small id="passwordStrengthText">
                        كلمة المرور يجب أن تحتوي على 6 أحرف على الأقل.
                    </small>
                </div>

                <!-- تأكيد كلمة المرور -->
                <div class="input-group">
                    <label for="confirmPassword">تأكيد كلمة المرور</label>

                    <div class="password-input">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="أعد كتابة كلمة المرور"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                            aria-label="إظهار كلمة المرور"
                        >
                            👁
                        </button>

                    </div>
                </div>

                <!-- صورة الحساب -->
                <div class="upload-group">

                    <label>صورة الملف الشخصي <span>(اختياري)</span></label>

                    <label class="upload-box" for="profileImageInput">

                        <div class="upload-icon">📷</div>

                        <div>
                            <strong>إضافة صورة شخصية</strong>
                            <small>JPG / PNG — اختياري</small>
                        </div>

                    </label>

                    <input
                        type="file"
                        id="profileImageInput"
                        accept="image/jpeg,image/png,image/webp"
                        hidden
                    >

                    <div id="profilePreview" class="image-preview"></div>

                </div>

                <!-- صورة الغلاف -->
                <div class="upload-group">

                    <label>صورة الغلاف <span>(اختياري)</span></label>

                    <label class="upload-box" for="coverImageInput">

                        <div class="upload-icon">🖼️</div>

                        <div>
                            <strong>إضافة صورة غلاف</strong>
                            <small>JPG / PNG — اختياري</small>
                        </div>

                    </label>

                    <input
                        type="file"
                        id="coverImageInput"
                        accept="image/jpeg,image/png,image/webp"
                        hidden
                    >

                    <div id="coverPreview" class="image-preview"></div>

                </div>

                <!-- النبذة -->
                <div class="input-group">

                    <label for="bio">
                        نبذة عنك
                        <span>(اختياري)</span>
                    </label>

                    <textarea
                        id="bio"
                        name="bio"
                        maxlength="160"
                        placeholder="اكتب نبذة قصيرة عنك..."
                    ></textarea>

                    <div class="character-count">
                        <span id="bioCount">0</span>/160
                    </div>

                </div>

                <!-- الشروط -->
                <label class="terms-check">

                    <input
                        type="checkbox"
                        id="agreeTerms"
                        required
                    >

                    <span>
                        أوافق على شروط استخدام sky7 وسياسة الخصوصية.
                    </span>

                </label>

                <!-- إنشاء الحساب -->
                <button
                    type="submit"
                    id="registerButton"
                    class="primary-button"
                >
                    <span id="registerButtonText">إنشاء الحساب</span>
                    <span id="registerLoader" hidden>جاري إنشاء الحساب...</span>
                </button>

            </form>

            <!-- تسجيل الدخول -->
            <div class="auth-footer">

                <span>لديك حساب بالفعل؟</span>

                <a href="index.html">
                    تسجيل الدخول
                </a>

            </div>

        </section>

    </main>

    <script type="module">
        import {
            registerUser
        } from "./js/auth.js";

        const form = document.getElementById("registrationForm");

        const fullNameInput = document.getElementById("fullName");
        const usernameInput = document.getElementById("username");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirmPassword");
        const bioInput = document.getElementById("bio");

        const profileImageInput =
            document.getElementById("profileImageInput");

        const coverImageInput =
            document.getElementById("coverImageInput");

        const authMessage =
            document.getElementById("authMessage");

        const registerButton =
            document.getElementById("registerButton");

        const registerButtonText =
            document.getElementById("registerButtonText");

        const registerLoader =
            document.getElementById("registerLoader");

        /* =========================
           إظهار / إخفاء كلمة المرور
        ========================= */

        document.querySelectorAll(".password-toggle").forEach(button => {

            button.addEventListener("click", () => {

                const input =
                    document.getElementById(button.dataset.target);

                if (input.type === "password") {
                    input.type = "text";
                    button.textContent = "🙈";
                } else {
                    input.type = "password";
                    button.textContent = "👁";
                }

            });

        });

        /* =========================
           عداد النبذة
        ========================= */

        const bioCount =
            document.getElementById("bioCount");

        bioInput.addEventListener("input", () => {
            bioCount.textContent = bioInput.value.length;
        });

        /* =========================
           قوة كلمة المرور
        ========================= */

        const passwordStrengthBar =
            document.getElementById("passwordStrengthBar");

        const passwordStrengthText =
            document.getElementById("passwordStrengthText");

        passwordInput.addEventListener("input", () => {

            const password = passwordInput.value;

            let strength = 0;

            if (password.length >= 6) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            passwordStrengthBar.style.width =
                `${strength * 25}%`;

            if (!password) {
                passwordStrengthText.textContent =
                    "كلمة المرور يجب أن تحتوي على 6 أحرف على الأقل.";
            } else if (strength <= 1) {
                passwordStrengthText.textContent =
                    "كلمة مرور ضعيفة";
            } else if (strength === 2) {
                passwordStrengthText.textContent =
                    "كلمة مرور متوسطة";
            } else {
                passwordStrengthText.textContent =
                    "كلمة مرور قوية";
            }

        });

        /* =========================
           معاينة الصور
        ========================= */

        function previewImage(input, containerId) {

            const container =
                document.getElementById(containerId);

            container.innerHTML = "";

            const file = input.files?.[0];

            if (!file) return;

            const reader = new FileReader();

            reader.onload = event => {

                const img =
                    document.createElement("img");

                img.src = event.target.result;
                img.alt = "معاينة الصورة";

                container.appendChild(img);

            };

            reader.readAsDataURL(file);
        }

        profileImageInput.addEventListener("change", () => {
            previewImage(
                profileImageInput,
                "profilePreview"
            );
        });

        coverImageInput.addEventListener("change", () => {
            previewImage(
                coverImageInput,
                "coverPreview"
            );
        });

        /* =========================
           رسائل الصفحة
        ========================= */

        function showMessage(message, type = "error") {

            authMessage.hidden = false;
            authMessage.textContent = message;
            authMessage.className =
                `auth-message ${type}`;

        }

        /* =========================
           إرسال التسجيل
        ========================= */

        form.addEventListener("submit", async event => {

            event.preventDefault();

            const fullName =
                fullNameInput.value.trim();

            const username =
                usernameInput.value.trim().toLowerCase();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;

            const bio =
                bioInput.value.trim();

            /* التحقق من البيانات */

            if (password !== confirmPassword) {

                showMessage(
                    "كلمتا المرور غير متطابقتين."
                );

                return;
            }

            if (!/^[a-zA-Z0-9_]+$/.test(username)) {

                showMessage(
                    "اسم المستخدم يجب أن يحتوي على حروف وأرقام وشرطة سفلية فقط."
                );

                return;
            }

            if (username.length < 3) {

                showMessage(
                    "اسم المستخدم يجب أن يكون 3 أحرف على الأقل."
                );

                return;
            }

            registerButton.disabled = true;

            registerButtonText.hidden = true;
            registerLoader.hidden = false;

            authMessage.hidden = true;

            try {

                await registerUser({

                    fullName,
                    username,
                    email,
                    password,
                    bio,

                    profileImage:
                        profileImageInput.files?.[0] || null,

                    coverImage:
                        coverImageInput.files?.[0] || null

                });

                showMessage(
                    "تم إنشاء الحساب بنجاح. جاري الانتقال...",
                    "success"
                );

                setTimeout(() => {
                    window.location.href = "profile.html";
                }, 1000);

            } catch (error) {

                console.error(error);

                let message =
                    "حدث خطأ أثناء إنشاء الحساب.";

                if (error.code === "auth/email-already-in-use") {
                    message =
                        "هذا البريد الإلكتروني مستخدم بالفعل.";
                }

                if (error.code === "auth/invalid-email") {
                    message =
                        "البريد الإلكتروني غير صحيح.";
                }

                if (error.code === "auth/weak-password") {
                    message =
                        "كلمة المرور ضعيفة.";
                }

                if (error.message) {
                    message = error.message;
                }

                showMessage(message);

                registerButton.disabled = false;

                registerButtonText.hidden = false;
                registerLoader.hidden = true;
            }

        });

    </script>

</body>
</html>
